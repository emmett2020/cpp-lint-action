name: 'cpp-lint-action'
description: cpp-lint-action is a tool used to check C++ code quality in Github workflow.
author: emmettzhang2020@outlook.com
branding:
  icon: "check-circle"
  color: "red"
inputs:
  log-level:
    description: |
      Set the log verbose level of cpp-lint-action.
      Supports: [trace, debug, info, error]
    default: info
  target-revision:
    description: |
      Set the target revision of git repository. It usually is the default branch
      you want to be merged into. If you omit this option, cpp-lint-action will
      automatically detect this.
    type: string
  enable-comment-on-issue:
    description: Whether enable comment on Github issues
    type: boolean
    default: true
  enable-pull-request-review:
    description: Whether enable Github pull-request review comment
    type: boolean
    default: false
  enable-step-summary:
    description: Whether enable write step summary to Github action
    type: boolean
    default: true
  enable-action-output:
    description: Whether enable write output to Github action
    type: boolean
    default: true
  disable-errors:
    description: |
      Whether disable errors. If errors are disabled, this action will not be failed.
      You can use this action's output to customize later behavior.
    type: boolean
    default: false
  jobs:
    description: How many files each enabled tool can check in parallel
    type: string
    default: "1"
  max-review-comments:
    description: Maximum pull request review comments to create
    type: string
    default: "50"

  enable-clang-format:
    description: Enable clang-format check
    type: boolean
    default: true
  enable-clang-format-fastly-exit:
    description: |
      Enabel clang-format fastly exit. This means
      cpp-lint-action will stop clang-format as soon
      as first file error occurs
    type: boolean
    default: false
  clang-format-version:
    description: |
      Set the version of clang-format. Don't specify
      both this option and the clang-format-binary option
      to avoid ambigous. And the clang-format-${version} must
      exist in your $PATH
    type: string
    default: "22"
  clang-format-binary:
    description: |
      Set the full path of clang-format executable binary.
      Don't spefify both this option and the clang-format-version
      option to avoid ambigous
    type: string
  clang-format-file-iregex:
    description: Set the source file filter for clang-format.
    type: string

  enable-clang-tidy:
    description: Enable clang-tidy check
    type: boolean
    default: true
  enable-clang-tidy-fastly-exit:
    description: |
      Enabel clang-tidy fastly exit. This means
      cpp-lint-action will stop clang-tidy as soon
      as first file error occurs
    type: boolean
    default: false
  clang-tidy-version:
    description: |
      Set the version of clang-tidy. Don't specify
      both this option and the clang-tidy-binary option
      to avoid ambigous. And the clang-tidy-${version} must
      exist in your $PATH
    type: string
    default: "22"
  clang-tidy-binary:
    description: |
      Set the full path of clang-tidy executable binary.
      Don't spefify both this option and the clang-tidy-version
      option to avoid ambigous
    type: string
  clang-tidy-file-iregex:
    description: Set the source file filter for clang-tidy.
    type: string
  clang-tidy-database:
    description: Same as clang-tidy -p option
    type: string
  clang-tidy-allow-no-checks:
    description: Enabel clang-tidy allow_no_check option
    type: boolean
    default: false
  clang-tidy-enable-check-profile:
    description: Enabel clang-tidy enable_check_profile option
    type: boolean
    default: false
  clang-tidy-checks:
    description: Same as clang-tidy checks option
    type: string
  clang-tidy-config:
    description: Same as clang-tidy config option
    type: string
  clang-tidy-config-file:
    description: Same as clang-tidy config-file option
    type: string
  clang-tidy-header-filter:
    description: Same as clang-tidy header-filter option
    type: string
  clang-tidy-line-filter:
    description: Same as clang-tidy line-filter option
    type: string

outputs:
  clang-tidy-failed-number:
    description: An integer of how many file fails on clang-tidy check
    value: ${{ steps.on_linux.outputs.clang_tidy_failed_number }}
  clang-format-failed-number:
    description: An integer of how many file fails on clang-format check
    value: ${{ steps.on_linux.outputs.clang_format_failed_number }}

runs:
  using: "composite"
  steps:
    - name: Install dependencies on Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        INPUT_CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
        INPUT_CLANG_TIDY_VERSION: ${{ inputs.clang-tidy-version }}
        INPUT_CLANG_FORMAT_BINARY: ${{ inputs.clang-format-binary }}
        INPUT_CLANG_TIDY_BINARY: ${{ inputs.clang-tidy-binary }}
      run: |
        set -euo pipefail
        default_clang_tool_version="22"

        clang_format_version="${INPUT_CLANG_FORMAT_VERSION}"
        clang_tidy_version="${INPUT_CLANG_TIDY_VERSION}"
        : "${clang_format_version:=${default_clang_tool_version}}"
        : "${clang_tidy_version:=${default_clang_tool_version}}"

        clang_tool_packages=()
        if [[ -z "${INPUT_CLANG_FORMAT_BINARY}"                               \
              && "${clang_format_version}" == "${default_clang_tool_version}" ]]; then
          if ! command -v "clang-format-${default_clang_tool_version}" >/dev/null 2>&1; then
            clang_tool_packages+=("clang-format-${default_clang_tool_version}")
          fi
        fi
        if [[ -z "${INPUT_CLANG_TIDY_BINARY}"                               \
              && "${clang_tidy_version}" == "${default_clang_tool_version}" ]]; then
          if ! command -v "clang-tidy-${default_clang_tool_version}" >/dev/null 2>&1; then
            clang_tool_packages+=("clang-tidy-${default_clang_tool_version}")
          fi
        fi

        if (( ${#clang_tool_packages[@]} > 0 )); then
          "${GITHUB_ACTION_PATH}/scripts/linux/ubuntu/install_llvm_tools.sh" \
            "${default_clang_tool_version}"                                  \
            "${clang_tool_packages[@]}"
        fi

        version_file="${GITHUB_ACTION_PATH}/VERSION"
        release_version=$(sed '/^$/d' "${version_file}" | sed 's/[[:space:]]*$//')
        release_version_str=$(echo "${release_version}" | tr '.' '_')
        archive_name="cpp_lint_action_${release_version_str}_ubuntu_24_04_${{ runner.arch }}.tar.gz"
        release_url="https://github.com/emmett2020/cpp-lint-action/releases/download/v${release_version}"
        echo "Current path: $(pwd), current version: ${release_version}"
        wget -q "${release_url}/${archive_name}" -O "${archive_name}"
        wget -q "${release_url}/${archive_name}.sha256" -O "${archive_name}.sha256"
        sha256sum -c "${archive_name}.sha256"
        tar -xf "${archive_name}"
        cd cpp_lint_action && ls -lrth && ./install.sh


    - name: Run cpp-lint-action on Linux
      id: on_linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        INPUT_LOG_LEVEL: ${{ inputs.log-level }}
        INPUT_TARGET_REVISION: ${{ inputs.target-revision }}
        INPUT_ENABLE_COMMENT_ON_ISSUE: ${{ inputs.enable-comment-on-issue }}
        INPUT_ENABLE_PULL_REQUEST_REVIEW: ${{ inputs.enable-pull-request-review }}
        INPUT_ENABLE_STEP_SUMMARY: ${{ inputs.enable-step-summary }}
        INPUT_ENABLE_ACTION_OUTPUT: ${{ inputs.enable-action-output }}
        INPUT_DISABLE_ERRORS: ${{ inputs.disable-errors }}
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_MAX_REVIEW_COMMENTS: ${{ inputs.max-review-comments }}
        INPUT_ENABLE_CLANG_FORMAT: ${{ inputs.enable-clang-format }}
        INPUT_ENABLE_CLANG_FORMAT_FASTLY_EXIT: ${{ inputs.enable-clang-format-fastly-exit }}
        INPUT_CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
        INPUT_CLANG_FORMAT_BINARY: ${{ inputs.clang-format-binary }}
        INPUT_CLANG_FORMAT_FILE_IREGEX: ${{ inputs.clang-format-file-iregex }}
        INPUT_ENABLE_CLANG_TIDY: ${{ inputs.enable-clang-tidy }}
        INPUT_ENABLE_CLANG_TIDY_FASTLY_EXIT: ${{ inputs.enable-clang-tidy-fastly-exit }}
        INPUT_CLANG_TIDY_VERSION: ${{ inputs.clang-tidy-version }}
        INPUT_CLANG_TIDY_BINARY: ${{ inputs.clang-tidy-binary }}
        INPUT_CLANG_TIDY_FILE_IREGEX: ${{ inputs.clang-tidy-file-iregex }}
        INPUT_CLANG_TIDY_DATABASE: ${{ inputs.clang-tidy-database }}
        INPUT_CLANG_TIDY_ALLOW_NO_CHECKS: ${{ inputs.clang-tidy-allow-no-checks }}
        INPUT_CLANG_TIDY_ENABLE_CHECK_PROFILE: ${{ inputs.clang-tidy-enable-check-profile }}
        INPUT_CLANG_TIDY_CHECKS: ${{ inputs.clang-tidy-checks }}
        INPUT_CLANG_TIDY_CONFIG: ${{ inputs.clang-tidy-config }}
        INPUT_CLANG_TIDY_CONFIG_FILE: ${{ inputs.clang-tidy-config-file }}
        INPUT_CLANG_TIDY_HEADER_FILTER: ${{ inputs.clang-tidy-header-filter }}
        INPUT_CLANG_TIDY_LINE_FILTER: ${{ inputs.clang-tidy-line-filter }}
      run: |
        echo "::group::Adjust repository"
        set -euo pipefail

        if [[ "${DEBUG_CPP_LINT_ACTION:-}" = "true"  ]]; then
          # Debugging mode may not have remote repository.
          echo "Enabled debugging mode"
          default_branch="${INPUT_TARGET_REVISION}"
        else
          repo_full_path="${GITHUB_WORKSPACE}"
          echo "Full path of testing repository: ${repo_full_path}"
          pushd "${repo_full_path}"

          current_branch=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch of testing repository: ${current_branch}"

          default_branch=""
          if [[ -n "${INPUT_TARGET_REVISION}" ]]; then
            default_branch="${INPUT_TARGET_REVISION}"
          else
            git fetch origin
            default_branch=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          fi
          echo "Default branch of testing repository: ${default_branch}"

          if [ "${current_branch}" != "${default_branch}" ]; then
            git fetch origin "${default_branch}":"${default_branch}"
          fi

          popd
        fi

        echo "::endgroup::"

        default_clang_tool_version="22"
        clang_format_version="${INPUT_CLANG_FORMAT_VERSION}"
        clang_tidy_version="${INPUT_CLANG_TIDY_VERSION}"
        : "${clang_format_version:=${default_clang_tool_version}}"
        : "${clang_tidy_version:=${default_clang_tool_version}}"

        args=(
          "--log-level=${INPUT_LOG_LEVEL}"
          "--target-revision=${default_branch}"
          "--enable-comment-on-issue=${INPUT_ENABLE_COMMENT_ON_ISSUE}"
          "--enable-pull-request-review=${INPUT_ENABLE_PULL_REQUEST_REVIEW}"
          "--enable-step-summary=${INPUT_ENABLE_STEP_SUMMARY}"
          "--enable-action-output=${INPUT_ENABLE_ACTION_OUTPUT}"
          "--disable-errors=${INPUT_DISABLE_ERRORS}"
          "--jobs=${INPUT_JOBS}"
          "--max-review-comments=${INPUT_MAX_REVIEW_COMMENTS}"
          "--enable-clang-format=${INPUT_ENABLE_CLANG_FORMAT}"
          "--enable-clang-format-fastly-exit=${INPUT_ENABLE_CLANG_FORMAT_FASTLY_EXIT}"
          "--enable-clang-tidy=${INPUT_ENABLE_CLANG_TIDY}"
          "--enable-clang-tidy-fastly-exit=${INPUT_ENABLE_CLANG_TIDY_FASTLY_EXIT}"
          "--clang-tidy-enable-check-profile=${INPUT_CLANG_TIDY_ENABLE_CHECK_PROFILE}"
          "--clang-tidy-allow-no-checks=${INPUT_CLANG_TIDY_ALLOW_NO_CHECKS}"
        )

        if [[ -n "${INPUT_CLANG_FORMAT_BINARY}" ]]; then
          args+=("--clang-format-binary=${INPUT_CLANG_FORMAT_BINARY}")
        elif [[ -n "${clang_format_version}" ]]; then
          args+=("--clang-format-version=${clang_format_version}")
        fi
        if [[ -n "${INPUT_CLANG_FORMAT_FILE_IREGEX}" ]]; then
          args+=("--clang-format-file-iregex=${INPUT_CLANG_FORMAT_FILE_IREGEX}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_BINARY}" ]]; then
          args+=("--clang-tidy-binary=${INPUT_CLANG_TIDY_BINARY}")
        elif [[ -n "${clang_tidy_version}" ]]; then
          args+=("--clang-tidy-version=${clang_tidy_version}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_FILE_IREGEX}" ]]; then
          args+=("--clang-tidy-file-iregex=${INPUT_CLANG_TIDY_FILE_IREGEX}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_DATABASE}" ]]; then
          args+=("--clang-tidy-database=${INPUT_CLANG_TIDY_DATABASE}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_CHECKS}" ]]; then
          args+=("--clang-tidy-checks=${INPUT_CLANG_TIDY_CHECKS}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_CONFIG}" ]]; then
          args+=("--clang-tidy-config=${INPUT_CLANG_TIDY_CONFIG}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_CONFIG_FILE}" ]]; then
          args+=("--clang-tidy-config-file=${INPUT_CLANG_TIDY_CONFIG_FILE}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_HEADER_FILTER}" ]]; then
          args+=("--clang-tidy-header-filter=${INPUT_CLANG_TIDY_HEADER_FILTER}")
        fi
        if [[ -n "${INPUT_CLANG_TIDY_LINE_FILTER}" ]]; then
          args+=("--clang-tidy-line-filter=${INPUT_CLANG_TIDY_LINE_FILTER}")
        fi

        /usr/local/bin/cpp-lint-action "${args[@]}"
